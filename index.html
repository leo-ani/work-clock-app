<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.leoani.dpdns.org;">
<meta name="theme-color" content="#F4F5F6">
<meta name="color-scheme" content="light dark">
<title>工时记录助手</title>
<style>
/* 🟢 纯黑护眼极简色彩 */
:root {
  --bg: #F4F5F6;
  --surface: #FFFFFF;
  --surface-hover: #F8F9FA;
  --text: #000000;
  --text-secondary: #6B7280;
  --text-tertiary: #9CA3AF;
  --primary: #52796F;
  --primary-soft: #E6EEEA;
  --color-ot: #D4A373;
  --color-weekend: #7B95A6;
  --border: #E5E7EB;
  --border-strong: #D1D5DB;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 999px;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
  --safe-top: env(safe-area-inset-top, 20px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface-hover: #334155;
    --text: #FFFFFF;
    --text-secondary: #94A3B8;
    --text-tertiary: #64748B;
    --primary: #7BA99A;
    --primary-soft: #1E3A34;
    --color-ot: #E5C07B;
    --color-weekend: #93B4C6;
    --border: #334155;
    --border-strong: #475569;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  }
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  font-feature-settings: "tnum"; -webkit-font-smoothing: antialiased;
  overflow: hidden; height: 100dvh;
}
button { background: none; border: none; cursor: pointer; color: inherit; font: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.hidden { display: none !important; }

#app { max-width: 480px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding-top: var(--safe-top); background: var(--bg); }

/* Header */
.header { padding: 16px; background: transparent; transition: all 0.3s cubic-bezier(0.2,0.8,0.2,1); overflow: hidden; flex-shrink: 0; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; transition: margin 0.3s; }
.app-name { font-weight: 800; font-size: 16px; color: var(--text); letter-spacing: -0.3px; }
.header-year { color: var(--text-tertiary); font-size: 13px; margin-left: 6px; font-weight: 500; }
.sync-bar { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-weight: 500; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #10B981; transition: background 0.3s; }
.sync-dot.pending { background: #F59E0B; }
.sync-dot.error { background: #EF4444; }
.sync-dot.syncing { background: #3B82F6; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

.header-month { display: flex; justify-content: center; align-items: center; gap: 24px; margin-bottom: 20px; transition: all 0.3s; max-height: 60px; opacity: 1; }
.month-label { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; color: var(--text); min-width: 80px; text-align: center; }
.nav-arrow { font-size: 18px; color: var(--text-tertiary); padding: 8px; cursor: pointer; }
.today-btn { font-size: 11px; padding: 4px 10px; border-radius: var(--radius-full); background: var(--primary-soft); color: var(--primary); font-weight: 600; }

.stats-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 12px; box-shadow: var(--shadow-sm); display: flex; transition: all 0.3s; max-height: 100px; }
.stat-item { flex: 1; text-align: center; }
.stat-value { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; color: var(--text); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }

.progress-wrap { margin-top: 16px; padding: 0 4px; transition: all 0.3s; max-height: 40px; }
.progress-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); width: 0%; border-radius: 2px; transition: width 0.3s; }
.progress-text { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-top: 8px; font-weight: 600; }

/* 智能折叠 */
#app.collapse-header .header { padding-bottom: 8px; border-bottom: 1px solid var(--border); background: var(--surface); }
#app.collapse-header .header-top { margin-bottom: 0; }
#app.collapse-header .header-month,
#app.collapse-header .stats-bar,
#app.collapse-header .progress-wrap { max-height: 0; opacity: 0; margin: 0; padding: 0; pointer-events: none; overflow: hidden; }

/* 页面框架 */
.page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.page.active { display: flex; }
.page-scroll { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }

/* 日历 */
.weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px; font-weight: 600;}
.weekdays span:first-child, .weekdays span:last-child { color: #EF4444; }
.days-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.day-cell { 
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
  border-radius: var(--radius-md); font-size: 16px; font-weight: 600; color: var(--text); 
  cursor: pointer; position: relative; transition: all 0.2s; border: 1.5px solid transparent;
}
.day-cell.has-record:not(.today):not(.selected) { background: var(--primary-soft); }
.day-cell.has-record:not(.today):not(.selected):hover { background: #d8e8e2; }
.day-cell.today { background: var(--primary); color: #FFFFFF; }
.day-cell.selected:not(.today) { border-color: var(--primary); color: var(--primary); background: var(--surface); }
.day-cell.other-month { color: var(--text-tertiary); opacity: 0.4; }
.day-sub { font-size: 10px; color: var(--text-secondary); margin-top: 2px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-cell.has-record .day-sub { color: var(--primary); font-weight: 800; }
.day-cell.today .day-sub { color: rgba(255,255,255,0.9); }
.dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.star { position: absolute; top: 4px; right: 5px; font-size: 11px; color: var(--color-ot); }

/* 详情与空状态 */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-tertiary); }
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
.empty-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-desc { font-size: 13px; }

/* 按钮 */
.btns-group { display: flex; flex-direction: column; gap: 12px; }
.btn { height: 52px; border-radius: var(--radius-md); border: none; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #FFFFFF; }
.btn-secondary { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.btn-danger { background: #EF4444; color: #fff; }

/* 统计面板 */
.card-num { font-size: 38px; font-weight: 900; letter-spacing: -1px; margin: 8px 0; color: var(--text); }
.card-sub { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; text-align: center; }
.stat-box-num { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: var(--text); }
.stat-box-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-weight: 600; }
.chart-title { font-size: 16px; font-weight: 900; color: var(--text); margin-bottom: 20px; }
.hours-dist { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.hours-donut { width: 140px; height: 140px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
.hours-donut::after { content: ""; position: absolute; width: 90px; height: 90px; background: var(--surface); border-radius: 50%; }
.hours-donut-center { position: relative; z-index: 2; text-align: center; }
.hours-donut-total { font-size: 24px; font-weight: 900; color: var(--text); }
.hours-donut-label { font-size: 10px; color: var(--text-tertiary); font-weight: 800; letter-spacing: 1px; }
.hours-list { width: 100%; display: flex; flex-direction: column; }
.hours-list-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.hours-list-row:last-child { border-bottom: none; }
.hours-list-name { font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text); }
.hours-list-name::before { content: ""; width: 8px; height: 8px; border-radius: 2px; }
.hours-list-money { font-weight: 800; color: var(--text); }
.row-normal .hours-list-name::before { background: var(--primary); }
.row-ot .hours-list-name::before { background: var(--color-ot); }
.row-weekend .hours-list-name::before { background: var(--color-weekend); }
.row-holiday .hours-list-name::before { background: #EF4444; }

/* 调休账本 */
.ledger-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.ledger-balance { font-size: 30px; font-weight: 900; letter-spacing: -0.5px; color: var(--text); }
.ledger-stat { text-align: right; font-size: 12px; color: var(--text-secondary); line-height: 1.6; font-weight: 500; }
.ledger-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
.ledger-item:last-child { border-bottom: none; padding-bottom: 0; }
.ledger-val.earn { color: #10B981; font-weight: 900; }
.ledger-val.use { color: #F87171; font-weight: 900; }

/* 底部导航 */
.bottom-nav { display: flex; border-top: 1px solid var(--border); background: var(--surface); padding: 8px 0 var(--safe-bottom); flex-shrink: 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-tertiary); cursor: pointer; }
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 20px; font-weight: 500;}
.nav-label { font-size: 11px; font-weight: 800; }

/* 弹窗 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; align-items: flex-end; z-index: 100; }
.modal-overlay.show { display: flex; }
.modal-content { background: var(--surface); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 24px 24px 0 0; padding: 24px 20px calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1); max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; }
.modal-overlay.show .modal-content { transform: translateY(0); }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.modal-title { font-size: 18px; font-weight: 900; }
.modal-close { width: 32px; height: 32px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; }

/* 表单与选项 */
.field-label { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.option-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
.option-grid.cols-2 { grid-template-columns: repeat(2,1fr); }
.option-btn { padding: 10px 4px; border: 1.5px solid transparent; border-radius: var(--radius-md); background: var(--bg); text-align: center; font-size: 13px; font-weight: 600; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s; min-height: 52px; }
.option-btn.active { background: var(--surface); border-color: var(--primary); color: var(--primary); }
.quick-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.quick-tag { padding: 8px 14px; background: var(--bg); border-radius: var(--radius-full); font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.quick-tag.danger { color: #EF4444; background: #FEF2F2; }
.hours-box { background: var(--bg); border-radius: var(--radius-md); padding: 0 16px; margin-bottom: 20px; }
.hours-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); }
.hours-row:last-child { border-bottom: none; }
.hours-control { display: flex; align-items: center; gap: 12px; }
.hours-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 600; }
.hours-value { min-width: 60px; text-align: center; font-size: 20px; font-weight: 900; }
.hours-input { width: 70px; text-align: center; font-size: 20px; font-weight: 900; border: 1.5px solid var(--primary); border-radius: var(--radius-md); padding: 4px; }
.note-area textarea { width: 100%; height: 80px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); resize: none; color: var(--text); font-size: 14px; }
.note-area textarea:focus { border-color: var(--primary); }

/* Toast */
.toast-wrap { position: fixed; top: 20px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; z-index: 1000; pointer-events: none; }
.toast { background: rgba(30,32,38,0.9); color: #fff; padding: 10px 20px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; margin-bottom: 8px; box-shadow: var(--shadow-lg); animation: toastIn 0.3s cubic-bezier(0.2,0.8,0.2,1); backdrop-filter: blur(8px); }
.toast.success { color: #10B981; }
.toast.error { color: #EF4444; }
@keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* Auth Page */
.auth-page { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.auth-box { width: 100%; max-width: 360px; background: var(--surface); padding: 32px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
.auth-title { font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 8px; }
.auth-subtitle { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
.form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); font-size: 16px; color: var(--text); }
.form-group input:focus { border-color: var(--primary); outline: none; }
.auth-btn { width: 100%; height: 50px; background: var(--primary); color: #fff; border-radius: var(--radius-md); font-size: 16px; font-weight: 700; margin-top: 8px; }
.auth-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary); }
.auth-switch button { color: var(--primary); font-weight: 700; margin-left: 4px; }
</style>
</head>
<body>

<div class="auth-page" id="authPage">
  <form class="auth-box" id="authForm" novalidate>
    <h1 class="auth-title">工时记录</h1>
    <p class="auth-subtitle" id="authSubtitle">登录到您的账户</p>
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" placeholder="3-32 位字母或数字" autocomplete="username" maxlength="32" required>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <div class="form-group hidden" id="confirmGroup">
      <label for="confirmPassword">确认密码</label>
      <input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="new-password">
    </div>
    <button class="auth-btn" id="authBtn" type="submit">登录</button>
    <div class="auth-switch">
      <span id="authSwitchText">还没有账号？</span>
      <button type="button" id="authSwitchLink">注册新账号</button>
    </div>
  </form>
</div>

<div id="app" style="display:none;">
  <header class="header">
    <div class="header-top">
      <div><span class="app-name">工时记录</span><span class="header-year" id="headerYear"></span></div>
      <button class="sync-bar" id="syncBar" type="button">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">已同步</span>
      </button>
    </div>
    <div class="header-month">
      <button class="nav-arrow" type="button" id="prevMonth">◀</button>
      <span class="month-label" id="headerMonth">十月</span>
      <button class="nav-arrow" type="button" id="nextMonth">▶</button>
      <button class="today-btn hidden" type="button" id="todayBtn">今天</button>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-value" id="stDays">0天</div><div class="stat-label">出勤</div></div>
      <div class="stat-item"><div class="stat-value" id="stHours">0H</div><div class="stat-label">工时</div></div>
      <button class="stat-item" type="button" id="incomeStatItem">
        <div class="stat-value" id="stMoney">¥0</div>
        <div class="stat-label" id="stMoneyLabel">收入</div>
      </button>
    </div>
    <div class="progress-wrap">
      <div class="progress-bg"><div class="progress-fill" id="monthProgress"></div></div>
      <div class="progress-text"><span>本月时间进度</span><span id="progressText">0%</span></div>
    </div>
  </header>

  <section class="page active" id="pageRecord">
    <div class="page-scroll">
      <div class="card">
        <div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="days-grid" id="calGrid"></div>
      </div>
      <div class="btns-group">
        <button class="btn btn-primary" id="quickPunchBtn" type="button">一键打卡（今日）</button>
        <button class="btn btn-secondary" id="addRecordBtn" type="button">添加记录（自定义工时）</button>
      </div>
      <div id="detailArea" style="margin-top:8px;"></div>
    </div>
  </section>

  <section class="page" id="pageStats">
    <div class="page-scroll">
      <div class="card">
        <div style="font-size: 13px; color: var(--text-secondary); font-weight: 600;">本月预估收入</div>
        <div class="card-num" id="monthIncome">¥0</div>
        <div class="card-sub">平均日薪 <span id="avgDailyIncome">¥0</span> · 最高日收入 <span id="maxDailyIncome">¥0</span></div>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-box-num" id="boxDays">0</div><div class="stat-box-label">出勤天数</div></div>
        <div class="stat-box"><div class="stat-box-num" id="boxHours">0</div><div class="stat-box-label">总工时</div></div>
        <div class="stat-box"><div class="stat-box-num" id="boxNormal">0</div><div class="stat-box-label">正班工时</div></div>
        <div class="stat-box"><div class="stat-box-num" id="boxOt">0</div><div class="stat-box-label">加班工时</div></div>
      </div>
      <div class="card">
        <h2 class="chart-title">工时分布</h2>
        <div id="hoursPie"></div>
      </div>
    </div>
  </section>

  <section class="page" id="pageCalculator">
    <div class="page-scroll">
      <div class="card">
        <h2 class="chart-title">个税计算 (简化)</h2>
        <div class="form-group"><label>税前月收入（元）</label><input type="number" id="taxIncome" value="0" step="100"></div>
        <div class="form-group"><label>五险一金比例（合计 %）</label><input type="number" id="taxInsuranceRate" value="0" step="0.5"></div>
        <div class="card" style="background:var(--bg); border:none; padding:16px; margin-top:16px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;"><span>应纳税所得额</span><strong id="dtTaxable">¥0</strong></div>
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;"><span>应缴个税</span><strong id="dtTax">¥0</strong></div>
          <div style="display:flex; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:16px;"><span>税后收入</span><strong id="dtNet" style="color:var(--primary); font-size:20px;">¥0</strong></div>
        </div>
      </div>
    </div>
  </section>

  <section class="page" id="pageSettings">
    <div class="page-scroll">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 class="chart-title" style="margin:0;">薪资模式</h2>
          <button class="btn btn-secondary" id="modeSwitch" type="button" style="height:36px; font-size:13px; padding:0 12px;">切换</button>
        </div>
        <div id="hourlyForm">

<script>
"use strict";
(function () {
  const APP_VERSION = '6.0.0';
  const API_BASE = 'https://api.leoani.dpdns.org/';
  const SESSION_KEY = 'wc_session';
  const USER_KEY = 'wc_username';
  
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const SHIFTS = ['day', 'early', 'mid', 'night'];
  const TYPES = ['normal', 'weekend', 'holiday', 'daily'];
  const LEAVES = ['none', 'sick', 'personal', 'paid', 'timeoff'];
  
  const LIMITS = {
    goal: { min: 0, max: 1000 },
    hours: { min: 0, max: 24 },
    hourlyRate: { min: 0, max: 5000 },
    salaryBase: { min: 0, max: 1000000 },
    salaryDays: { min: 1, max: 31 },
    salaryHours: { min: 1, max: 24 },
    salaryMultiplier: { min: 0, max: 5 },
    taxGross: { min: 0, max: 10000000 },
    deductionVal: { min: 0, max: 100000 },
    insurance: { pension: 20, medical: 10, unemployment: 5, fund: 12 }
  };
  
  const IIT_BRACKETS = [
    { max: 3000, rate: 0.03, quick: 0 },
    { max: 12000, rate: 0.10, quick: 210 },
    { max: 25000, rate: 0.20, quick: 1410 },
    { max: 35000, rate: 0.25, quick: 2660 },
    { max: 55000, rate: 0.30, quick: 4410 },
    { max: 80000, rate: 0.35, quick: 7160 },
    { max: Infinity, rate: 0.45, quick: 15160 },
  ];
  const THRESHOLD = 5000;
  const MAX_NOTE_LEN = 500;
  const HOUR_PRESET = { day: 8, early: 6, mid: 7, night: 7 };
  const MONTH_NAMES = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
  const WEEKDAY_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const SHIFT_NAMES = { day: '白班', early: '早班', mid: '中班', night: '晚班' };
  const TYPE_NAMES = { normal: '正班', weekend: '周末', holiday: '节假', daily: '日结' };
  const LEAVE_NAMES = { none: '上班', sick: '病假', personal: '事假', paid: '薪假', timeoff: '调休' };

  const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
  const clamp = (v, lo, hi, fb) => {
    const n = Number(v);
    if (!Number.isFinite(n)) return fb === undefined ? lo : fb;
    return Math.min(hi, Math.max(lo, n));
  };
  const round1 = (v) => Math.round(num(v) * 10) / 10;
  const pad2 = (n) => String(n).padStart(2, '0');
  const byId = (id) => document.getElementById(id);

  function formatDateKey(date) { return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`; }
  function parseDateKey(key) {
    if (typeof key !== 'string' || !DATE_RE.test(key)) return null;
    const parts = key.split('-').map(Number);
    const dt = new Date(parts[0], parts[1] - 1, parts[2]);
    if (dt.getFullYear() !== parts[0] || dt.getMonth() !== parts[1] - 1 || dt.getDate() !== parts[2]) return null;
    return dt;
  }
  const isWeekend = (date) => date.getDay() === 0 || date.getDay() === 6;

  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } }
  function safeRemove(key) { try { localStorage.removeItem(key); } catch (e) { } }
  function safeJson(key) { const raw = safeGet(key); if (!raw) return null; try { return JSON.parse(raw); } catch (e) { return null; } }

  const fmt = {
    money(v, opts) {
      const o = opts || {};
      if (o.hidden) return '****';
      return '¥' + num(v).toFixed(2);
    },
    compact(v, opts) {
      const o = opts || {};
      if (o.hidden) return '****';
      const n = num(v);
      const abs = Math.abs(n);
      const digits = o.digits === undefined ? 1 : o.digits;
      if (abs >= 1e8) return '¥' + (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + '亿';
      if (abs >= 1e4) return '¥' + (n / 1e4).toFixed(digits).replace(/\.0+$/, '') + '万';
      return '¥' + (Number.isInteger(n) ? n : n.toFixed(digits));
    },
    group(v) { return num(v).toLocaleString('zh-CN'); }
  };

  const Holiday = {
    isHoliday(k) { return ['01-01','05-01','10-01','10-02','10-03'].some(s => k.endsWith(s)); },
    isWorkday(k) { return false; },
    name(k) { return k.endsWith('10-01') ? '国庆' : (k.endsWith('01-01') ? '元旦' : '节假'); }
  };

  function createIncomeEngine(settings, holiday) {
    const mode = settings.mode === 'salary' ? 'salary' : 'hourly';
    function bucketOf(rec, date) {
      const key = formatDateKey(date);
      const makeup = holiday.isWorkday(key);
      if (rec.type === 'holiday' || (holiday.isHoliday(key) && !makeup)) return 'holiday';
      if ((isWeekend(date) && !makeup) || rec.type === 'weekend') return 'weekend';
      return 'normal';
    }
    function rateOf(kind) {
      if (mode === 'hourly') return kind === 'holiday' ? num(settings.holidayRate) : num(settings.normalRate);
      const map = {
        normal: num(settings.salaryNormal), ot: num(settings.salaryOt),
        weekend: num(settings.salaryWeekend), holiday: num(settings.salaryHoliday),
      };
      return map[kind] || 0;
    }
    function of(rec, date) {
      if (rec.leave === 'timeoff') {
        const bucket = bucketOf(rec, date);
        return 8 * rateOf(bucket === 'holiday' ? 'holiday' : (bucket === 'weekend' ? 'weekend' : 'normal'));
      }
      if (!rec || (rec.leave && rec.leave !== 'none')) return 0; 
      const normal = num(rec.normal);
      const ot = num(rec.ot);
      const bucket = bucketOf(rec, date);
      const isOtTimeoff = rec.otType === 'timeoff';
      if (mode === 'hourly') {
        if (bucket === 'holiday') return (normal + (isOtTimeoff ? 0 : ot)) * rateOf('holiday');
        if (bucket === 'weekend') return (normal + (isOtTimeoff ? 0 : ot)) * rateOf('weekend');
        return normal * rateOf('normal') + (isOtTimeoff ? 0 : ot * rateOf('normal'));
      }
      if (bucket === 'holiday') return (normal + (isOtTimeoff ? 0 : ot)) * rateOf('holiday');
      if (bucket === 'weekend') return (normal + (isOtTimeoff ? 0 : ot)) * rateOf('weekend');
      return normal * rateOf('normal') + (isOtTimeoff ? 0 : ot * rateOf('ot'));
    }
    return { mode, bucketOf, rateOf, of };
  }

  function aggregateMonth(year, month, records, settings, holiday, rev, goal) {
    const cacheKey = (Session.username || 'anon') + '|' + year + '-' + month + '|' + rev;
    if (Store.cache.has(cacheKey)) return Store.cache.get(cacheKey);
    
    const income = createIncomeEngine(settings, holiday);
    const cat = { normal: {h:0,d:0,i:0}, ot: {h:0,d:0,i:0}, weekend: {h:0,d:0,i:0}, holiday: {h:0,d:0,i:0} };
    let totalDays = 0, totalHours = 0, totalIncome = 0;
    let timeoffEarned = 0, timeoffUsed = 0;

    for (const key in records) {
      const rec = records[key];
      const date = parseDateKey(key);
      if (!date || date.getFullYear() !== year || date.getMonth() !== month) continue;
      
      if (rec.leave === 'timeoff') timeoffUsed += 8;
      else if (rec.otType === 'timeoff') timeoffEarned += num(rec.ot);

      if (rec.leave && rec.leave !== 'none' && rec.leave !== 'timeoff') continue;
      
      const normal = rec.leave === 'timeoff' ? 0 : num(rec.normal);
      const ot = rec.leave === 'timeoff' ? 0 : num(rec.ot);
      
      const dayIncome = income.of(rec, date);
      totalDays += 1;
      totalHours += normal + ot;
      totalIncome += dayIncome;
      
      const bucket = income.bucketOf(rec, date);
      if (bucket === 'weekend' || bucket === 'holiday') {
        cat[bucket].h += normal + ot;
        cat[bucket].d += 1;
        cat[bucket].i += dayIncome;
      } else {
        if (normal > 0) { cat.normal.h += normal; cat.normal.d += 1; cat.normal.i += normal * income.rateOf('normal'); }
        if (ot > 0) { cat.ot.h += ot; cat.ot.d += 1; cat.ot.i += (rec.otType === 'timeoff' ? 0 : ot * income.rateOf('ot')); }
      }
    }
    
    const safeGoal = num(goal);
    const summary = {
      year, month, cat, totalDays, totalHours, totalIncome,
      timeoffEarned, timeoffUsed,
      avgDailyHours: totalDays ? totalHours / totalDays : 0,
      avgDailyIncome: totalDays ? totalIncome / totalDays : 0,
      maxDailyIncome: 0, 
      goalPct: safeGoal > 0 ? Math.min(100, (totalHours / safeGoal) * 100) : 0,
    };
    
    if (Store.cache.size > 24) Store.cache.delete(Store.cache.keys().next().value);
    Store.cache.set(cacheKey, summary);
    return summary;
  }

  const defaultSettings = () => ({
    mode: 'hourly', normalRate: 0, holidayRate: 0,
    baseSalary: 0, salaryDays: 21.75, salaryHours: 8,
    performance: 0, bonus: 0, allowance: 0,
    salaryRateNormal: 1, salaryRateOt: 1.5, salaryRateWeekend: 2, salaryRateHoliday: 3,
    salaryNormal: 0, salaryOt: 0, salaryWeekend: 0, salaryHoliday: 0
  });

  const Store = {
    state: { records: {}, settings: defaultSettings(), goal: 0, deleted: {}, dataRev: 0 },
    rev: 0,
    deleted: {},
    cache: new Map(),
    dirtyRecords: new Set(),
    dirtyDeleted: new Set(),
    settingsDirty: false,
    inflight: null,
    saveTimer: null,

    persistCache() {
      if (!Session.username) return;
      clearTimeout(this._cacheT);
      this._cacheT = setTimeout(() => {
        safeSet('wc_cache_' + Session.username, JSON.stringify({ __state: this.state, __deleted: this.deleted }));
      }, 300);
    },

    loadCache() {
      if (!Session.username) return false;
      const parsed = safeJson('wc_cache_' + Session.username);
      if (!parsed || !parsed.__state) return false;
      this.state = parsed.__state;
      this.deleted = parsed.__deleted || {};
      return true;
    },

    buildPayload() {
      const records = {};
      for (const k of this.dirtyRecords) { if (this.state.records[k]) records[k] = this.state.records[k]; }
      const deleted = {};
      for (const k of this.dirtyDeleted) { deleted[k] = this.deleted[k] || Date.now(); }
      return { records, deleted, settings: this.state.settings, goal: this.state.goal, dataRev: this.state.dataRev };
    },

    async flush() {
      clearTimeout(this.saveTimer);
      if (this.inflight) return this.inflight;
      if (!Session.token) return null;
      if (this.dirtyRecords.size === 0 && this.dirtyDeleted.size === 0 && !this.settingsDirty) return null;

      const snapR = new Set(this.dirtyRecords);
      const snapD = new Set(this.dirtyDeleted);
      const payload = this.buildPayload();
      const settingsTouched = this.settingsDirty;

      this.inflight = (async () => {
        try {
          const res = await Api.setData(Session.username, payload, settingsTouched);
          this.settingsDirty = false;
          for (const k of snapR) this.dirtyRecords.delete(k);
          for (const k of snapD) this.dirtyDeleted.delete(k);
          
          if (res.data) {
            if (res.data.dataRev) this.state.dataRev = res.data.dataRev;
            if (res.data.records) {
              for (const k in res.data.records) { this.state.records[k] = res.data.records[k]; }
            }
          }
          this.cache.clear();
          this.setStatus('idle');
        } catch (err) {
          this.setStatus(err.code === 'UNAUTHORIZED' ? 'error' : 'pending');
          throw err;
        } finally {
          this.inflight = null;
        }
      })();
      return this.inflight;
    },

    setStatus(s) {
      const el = byId('syncText');
      const dot = byId('syncDot');
      if (!el) return;
      if (s === 'saving') { dot.className = 'sync-dot syncing'; el.textContent = '同步中'; }
      else if (s === 'pending') { dot.className = 'sync-dot pending'; el.textContent = '待上传'; }
      else if (s === 'error') { dot.className = 'sync-dot error'; el.textContent = '同步失败'; }
      else { dot.className = 'sync-dot'; el.textContent = '已同步'; }
    }
  };

  const Session = {
    username: null, token: null,
    init() { this.username = safeGet(USER_KEY); this.token = safeGet(SESSION_KEY); if (this.token) Api.token = this.token; },
    set(u, t) { this.username = u; this.token = t; Api.token = t; safeSet(USER_KEY, u); safeSet(SESSION_KEY, t); },
    clear() { this.username = null; this.token = null; Api.token = null; safeRemove(USER_KEY); safeRemove(SESSION_KEY); }
  };

  const Api = {
    token: null,
    async call(action, payload) {
      const headers = { 'Content-Type': 'application/json' };
      if (this.token) headers.Authorization = 'Bearer ' + this.token;
      let res;
      try {
        res = await fetch(API_BASE, { method: 'POST', headers, body: JSON.stringify({ action, ...payload }) });
      } catch (e) {
        throw new Error('网络连接失败，请检查网络');
      }
      let data = {};
      try { data = await res.json(); } catch (e) { }
      if (!res.ok) {
        const err = new Error(data.error || `请求失败 (${res.status})`);
        err.code = data.code;
        err.status = res.status;
        throw err;
      }
      return data;
    },
    async deriveHash(password, salt, kdf, iterations) {
      if (kdf === 'PBKDF2-SHA256') {
        return new Promise((resolve, reject) => {
          const w = new Worker(URL.createObjectURL(new Blob([`
            self.onmessage = async (e) => {
              const { p, s, r } = e.data;
              try {
                const enc = new TextEncoder();
                const km = await crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveBits']);
                const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(s), iterations: r, hash: 'SHA-256' }, km, 256);
                self.postMessage({ ok: 1, h: Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('') });
              } catch (err) { self.postMessage({ ok: 0, e: err.message }); }
            };
          `], { type: 'application/javascript' })));
          w.onmessage = (e) => { w.terminate(); e.data.ok ? resolve(e.data.h) : reject(new Error(e.data.e)); };
          w.postMessage({ p: password, s: salt, r: iterations });
        });
      }
      const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + password));
      return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
    },
    generateSalt() {
      const b = new Uint8Array(24); crypto.getRandomValues(b);
      return btoa(String.fromCharCode(...b));
    },
    getSalt(u) { return this.call('getSalt', { username: u }); },
    register(u, h, s, i) { return this.call('register', { username: u, hash: h, salt: s, kdf: 'PBKDF2-SHA256', iterations: i }); },
    login(u, h) { return this.call('login', { username: u, hash: h }); },
    getData(u) { return this.call('getData', { username: u }); },
    setData(u, d, st) { return this.call('setData', { username: u, data: d, settingsTouched: st }); }
  };

  const UI = {
    toast(msg, type='info') {
      const wrap = byId('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    },
    goPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === id));
      byId('app').classList.toggle('collapse-header', id !== 'pageRecord' && id !== 'pageStats');
      Render.all();
    },
    confirmDangerous(title, body) {
      return new Promise(resolve => {
        byId('confirmTitle').textContent = title;
        byId('confirmBody').innerHTML = body;
        byId('confirmModal').classList.add('show');
        const ok = byId('confirmOkBtn'), cancel = byId('confirmCancelBtn');
        const close = (val) => {
          byId('confirmModal').classList.remove('show');
          ok.onclick = null; cancel.onclick = null;
          resolve(val);
        };
        ok.onclick = () => close(true);
        cancel.onclick = () => close(false);
      });
    }
  };

  const Calendar = {
    currentDate: new Date(),
    selectedDate: null,
    nodes: [],
    init() {
      const grid = byId('calGrid');
      for (let i = 0; i < 42; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        grid.appendChild(cell);
      }
      this.nodes = Array.from(grid.children);
      byId('prevMonth').onclick = () => { this.currentDate.setMonth(this.currentDate.getMonth() - 1); Render.all(); };
      byId('nextMonth').onclick = () => { this.currentDate.setMonth(this.currentDate.getMonth() + 1); Render.all(); };
      byId('todayBtn').onclick = () => { this.currentDate = new Date(); this.selectedDate = formatDateKey(new Date()); Render.all(); };
      grid.onclick = (e) => {
        const cell = e.target.closest('.day-cell');
        if (cell && cell.dataset.key) { this.selectedDate = cell.dataset.key; Render.all(); }
      };
    },
    render() {
      const y = this.currentDate.getFullYear();
      const m = this.currentDate.getMonth();
      byId('headerYear').textContent = y + '年';
      byId('headerMonth').textContent = MONTH_NAMES[m];
      byId('todayBtn').classList.toggle('hidden', y === new Date().getFullYear() && m === new Date().getMonth());
      
      const first = new Date(y, m, 1);
      const lead = (first.getDay() + 6) % 7;
      const days = new Date(y, m + 1, 0).getDate();
      const prev = new Date(y, m, 0).getDate();
      const todayKey = formatDateKey(new Date());
      const recs = Store.state.records;

      for (let i = 0; i < 42; i++) {
        const cell = this.nodes[i];
        const off = i - lead;
        let d, muted = false;
        if (off < 0) { d = new Date(y, m - 1, prev + off + 1); muted = true; }
        else if (off >= days) { d = new Date(y, m + 1, off - days + 1); muted = true; }
        else { d = new Date(y, m, off + 1); }
        
        const key = formatDateKey(d);
        const rec = muted ? null : recs[key];
        
        cell.className = 'day-cell' + (muted ? ' other-month' : '') + 
          (key === todayKey ? ' today' : '') + 
          (key === this.selectedDate ? ' selected' : '') + 
          (rec ? ' has-record' : '');
        cell.dataset.key = muted ? '' : key;
        
        let html = `<span>${d.getDate()}</span>`;
        if (!muted && rec) {
          if (rec.leave && rec.leave !== 'none') html += `<span class="day-sub">${LEAVE_NAMES[rec.leave]}</span>`;
          else html += `<span class="day-sub">${round1(num(rec.normal)+num(rec.ot)).toFixed(1)}h</span>`;
          
          if (rec.note && rec.note.trim()) html += `<span class="star">★</span>`;
          else html += `<span class="dot"></span>`;
        } else if (!muted && Holiday.isHoliday(key)) {
          html += `<span class="day-sub">${Holiday.name(key)}</span>`;
        }
        cell.innerHTML = html;
      }
    }
  };

  const Detail = {
    render() {
      const area = byId('detailArea');
      const key = Calendar.selectedDate;
      if (!key) { area.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">选择日期</div></div>'; return; }
      
      const rec = Store.state.records[key];
      if (!rec) { area.innerHTML = '<div class="empty-state"><div class="empty-icon">🗓</div><div class="empty-title">这一天没有记录</div><div class="empty-desc">点击上方按钮添加打卡</div></div>'; return; }
      
      const isLeave = rec.leave && rec.leave !== 'none';
      const engine = createIncomeEngine(Store.state.settings, Holiday);
      const income = isLeave ? 0 : engine.of(rec, parseDateKey(key));
      
      area.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div style="font-size:16px; font-weight:700;">${key.slice(5)} ${WEEKDAY_NAMES[parseDateKey(key).getDay()]}</div>
            <div style="font-size:24px; font-weight:900; color:var(--primary);">¥${income.toFixed(2)}</div>
          </div>
          <div style="font-size:14px; color:var(--text-secondary); display:flex; justify-content:space-between;">
            <span>${SHIFT_NAMES[rec.shift] || '白班'} · ${TYPE_NAMES[rec.type] || '正班'}${isLeave ? ' · '+LEAVE_NAMES[rec.leave] : ''}</span>
            <span>${isLeave ? '休假中' : '正班 '+round1(rec.normal).toFixed(1)+'h'+(num(rec.ot)?' · 加班 '+round1(rec.ot).toFixed(1)+'h'+(rec.otType==='timeoff'?'(调休)':''):'')}</span>
          </div>
          ${rec.note ? `<div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:14px; color:var(--text-secondary);">备注：${rec.note}</div>` : ''}
        </div>
      `;
    }
  };

  const Stats = {
    render(summary) {
      byId('monthIncome').textContent = fmt.compact(summary.totalIncome);
      byId('avgDailyIncome').textContent = fmt.compact(summary.avgDailyIncome);
      byId('maxDailyIncome').textContent = fmt.compact(summary.maxDailyIncome || 0);
      
      byId('boxDays').textContent = String(summary.totalDays);
      byId('boxHours').textContent = round1(summary.totalHours).toFixed(1);
      byId('boxNormal').textContent = round1(summary.cat.normal.h).toFixed(1);
      byId('boxOt').textContent = round1(summary.cat.ot.h + summary.cat.weekend.h + summary.cat.holiday.h).toFixed(1);
      
      this.renderPie(summary);
      this.renderLedger(summary);
    },
    renderPie(s) {
      const c = byId('hoursPie');
      const total = s.cat.normal.h + s.cat.ot.h + s.cat.weekend.h + s.cat.holiday.h;
      if (total === 0) { c.innerHTML = '<div class="empty-state">暂无工时记录</div>'; return; }
      
      const p1 = (s.cat.normal.h / total) * 100;
      const p2 = p1 + (s.cat.ot.h / total) * 100;
      const p3 = p2 + (s.cat.weekend.h / total) * 100;
      
      c.innerHTML = `
        <div class="hours-dist">
          <div class="hours-donut" style="background:conic-gradient(var(--primary) 0% ${p1}%, var(--color-ot) ${p1}% ${p2}%, var(--color-weekend) ${p2}% ${p3}%, #EF4444 ${p3}% 100%);">
            <div class="hours-donut-center">
              <div class="hours-donut-total">${round1(total).toFixed(0)}</div>
              <div class="hours-donut-label">HOURS</div>
            </div>
          </div>
          <div class="hours-list">
            <div class="hours-list-row row-normal"><span class="hours-list-name">正班</span><span class="hours-list-money">${fmt.compact(s.cat.normal.i)}</span></div>
            <div class="hours-list-row row-ot"><span class="hours-list-name">平时加班</span><span class="hours-list-money">${fmt.compact(s.cat.ot.i)}</span></div>
            <div class="hours-list-row row-weekend"><span class="hours-list-name">周末加班</span><span class="hours-list-money">${fmt.compact(s.cat.weekend.i)}</span></div>
            <div class="hours-list-row row-holiday"><span class="hours-list-name">节假日加班</span><span class="hours-list-money">${fmt.compact(s.cat.holiday.i)}</span></div>
          </div>
        </div>
      `;
    },
    renderLedger(s) {
      const c = byId('hoursPie');
      if (s.timeoffEarned === 0 && s.timeoffUsed === 0) return;
      
      const balance = s.timeoffEarned - s.timeoffUsed;
      const div = document.createElement('div');
      div.className = 'card';
      div.style.marginTop = '16px';
      div.innerHTML = `
        <div class="ledger-header">
          <div>
            <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:600;">本月调休变化</div>
            <div class="ledger-balance" style="color:${balance<0?'#F87171':'var(--text)'}">${balance>0?'+':''}${balance.toFixed(1)} <span style="font-size:14px;font-weight:700;">小时</span></div>
          </div>
          <div class="ledger-stat">
            <div>获取: <span class="ledger-val earn">+${s.timeoffEarned.toFixed(1)}h</span></div>
            <div>消耗: <span class="ledger-val use">-${s.timeoffUsed.toFixed(1)}h</span></div>
          </div>
        </div>
      `;
      c.appendChild(div);
    }
  };

  const Render = {
    all() {
      const summary = aggregateMonth(Calendar.currentDate.getFullYear(), Calendar.currentDate.getMonth(), Store.state.records, Store.state.settings, Holiday, Store.rev, Store.state.goal);
      
      byId('stDays').textContent = summary.totalDays + '天';
      byId('stHours').textContent = round1(summary.totalHours).toFixed(1) + 'H';
      byId('stMoney').textContent = fmt.compact(summary.totalIncome);
      byId('monthProgress').style.width = summary.goalPct + '%';
      byId('progressText').textContent = summary.goalPct.toFixed(0) + '%';
      
      Calendar.render();
      Detail.render();
      if (byId('pageStats').classList.contains('active')) Stats.render(summary);
    }
  };

  const Clock = {
    draft: null,
    targetKey: null,
    init() {
      byId('quickPunchBtn').onclick = () => {
        const key = Calendar.selectedDate || formatDateKey(new Date());
        const date = parseDateKey(key);
        const type = isWeekend(date) ? 'weekend' : (Holiday.isHoliday(key) ? 'holiday' : 'normal');
        Store.state.records[key] = { shift: 'day', type, leave: 'none', normal: 8, ot: 0, otType: 'pay', note: '', updatedAt: Date.now() };
        Store.dirtyRecords.add(key);
        Store.rev++;
        Render.all();
        Store.flush();
        UI.toast('打卡成功', 'success');
      };

      byId('addRecordBtn').onclick = () => {
        this.targetKey = Calendar.selectedDate || formatDateKey(new Date());
        const rec = Store.state.records[this.targetKey] || { shift: 'day', type: 'normal', leave: 'none', normal: 8, ot: 0, otType: 'pay', note: '' };
        this.draft = { ...rec };
        byId('modalDate').textContent = this.targetKey.slice(5);
        byId('noteInput').value = this.draft.note;
        this.syncUI();
        byId('clockModal').classList.add('show');
      };

      const rows = ['shiftRow', 'typeRow', 'leaveRow'];
      rows.forEach(id => {
        byId(id).onclick = (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          if (id === 'shiftRow') this.draft.shift = btn.dataset.shift;
          if (id === 'typeRow') this.draft.type = btn.dataset.type;
          if (id === 'leaveRow') this.draft.leave = btn.dataset.leave;
          this.syncUI();
        };
      });

      document.querySelectorAll('[data-adjust]').forEach(btn => {
        btn.onclick = () => {
          const f = btn.dataset.adjust;
          this.draft[f] = Math.max(0, round1(this.draft[f] + Number(btn.dataset.delta)));
          this.syncUI();
        };
      });

      byId('otTypeRow').onclick = (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        this.draft.otType = btn.dataset.ottype;
        this.syncUI();
      };

      byId('clockSaveBtn').onclick = () => {
        this.draft.note = byId('noteInput').value.slice(0, 500);
        const isEmpty = this.draft.normal === 0 && this.draft.ot === 0 && this.draft.leave === 'none';
        if (isEmpty) {
          delete Store.state.records[this.targetKey];
          Store.dirtyDeleted.add(this.targetKey);
          Store.dirtyRecords.delete(this.targetKey);
        } else {
          this.draft.updatedAt = Date.now();
          Store.state.records[this.targetKey] = { ...this.draft };
          Store.dirtyRecords.add(this.targetKey);
          Store.dirtyDeleted.delete(this.targetKey);
        }
        Store.rev++;
        byId('clockModal').classList.remove('show');
        Render.all();
        Store.flush();
        UI.toast('保存成功', 'success');
      };
    },
    syncUI() {
      document.querySelectorAll('#shiftRow button').forEach(b => b.classList.toggle('active', b.dataset.shift === this.draft.shift));
      document.querySelectorAll('#typeRow button').forEach(b => b.classList.toggle('active', b.dataset.type === this.draft.type));
      document.querySelectorAll('#leaveRow button').forEach(b => b.classList.toggle('active', b.dataset.leave === this.draft.leave));
      byId('valNormal').textContent = round1(this.draft.normal).toFixed(1) + ' H';
      byId('valOt').textContent = round1(this.draft.ot).toFixed(1) + ' H';
      byId('otTypeRow').style.display = this.draft.ot > 0 ? 'flex' : 'none';
      document.querySelectorAll('#otTypeRow button').forEach(b => b.classList.toggle('active', b.dataset.ottype === this.draft.otType));
    }
  };

  const Settings = {
    init() {
      byId('modeSwitch').onclick = () => {
        Store.state.settings.mode = Store.state.settings.mode === 'salary' ? 'hourly' : 'salary';
        this.load();
        Store.settingsDirty = true;
        Store.rev++;
        Render.all();
      };
      byId('saveSettingsBtn').onclick = () => {
        if (Store.state.settings.mode === 'hourly') {
          Store.state.settings.normalRate = clamp(byId('inNormal').value, 0, 5000, 0);
          Store.state.settings.holidayRate = clamp(byId('inHoliday').value, 0, 5000, 0);
        } else {
          Store.state.settings.baseSalary = clamp(byId('inBaseSalary').value, 0, 1000000, 0);
          Store.state.settings.salaryDays = clamp(byId('inSalaryDays').value, 1, 31, 21.75);
          Store.state.settings.salaryHours = clamp(byId('inSalaryHours').value, 1, 24, 8);
          const base = Store.state.settings.baseSalary / Store.state.settings.salaryDays / Store.state.settings.salaryHours;
          Store.state.settings.salaryNormal = round1(base * 1);
          Store.state.settings.salaryOt = round1(base * 1.5);
          Store.state.settings.salaryWeekend = round1(base * 2);
          Store.state.settings.salaryHoliday = round1(base * 3);
        }
        Store.settingsDirty = true;
        Store.rev++;
        Render.all();
        Store.flush();
        UI.toast('设置已保存', 'success');
      };
      byId('goalSaveBtn').onclick = () => {
        Store.state.goal = clamp(byId('goalInput').value, 0, 1000, 0);
        Store.settingsDirty = true;
        Store.rev++;
        Render.all();
        Store.flush();
        UI.toast('目标已更新', 'success');
      };
    },
    load() {
      const s = Store.state.settings;
      byId('hourlyForm').classList.toggle('hidden', s.mode === 'salary');
      byId('salaryForm').classList.toggle('hidden', s.mode === 'hourly');
      byId('inNormal').value = s.normalRate;
      byId('inHoliday').value = s.holidayRate;
      byId('inBaseSalary').value = s.baseSalary;
      byId('inSalaryDays').value = s.salaryDays;
      byId('inSalaryHours').value = s.salaryHours;
      byId('goalInput').value = Store.state.goal;
    }
  };

  const Calculator = {
    init() {
      const calc = () => {
        const gross = clamp(byId('taxIncome').value, 0, 10000000, 0);
        const ins = gross * clamp(byId('taxInsuranceRate').value, 0, 100, 0) / 100;
        const taxable = Math.max(0, gross - ins - 5000);
        let tax = 0;
        for (const b of IIT_BRACKETS) {
          if (taxable <= b.max) { tax = Math.max(0, taxable * b.rate - b.quick); break; }
        }
        byId('dtTaxable').textContent = '¥' + taxable.toFixed(2);
        byId('dtTax').textContent = '¥' + tax.toFixed(2);
        byId('dtNet').textContent = '¥' + (gross - ins - tax).toFixed(2);
      };
      byId('taxIncome').oninput = calc;
      byId('taxInsuranceRate').oninput = calc;
    }
  };

  const App = {
    init() {
      Session.init();
      Calendar.init();
      Clock.init();
      Settings.init();
      Calculator.init();

      document.querySelectorAll('.nav-item').forEach(item => {
        item.onclick = () => UI.goPage(item.dataset.page);
      });
      byId('syncBar').onclick = () => { this.syncFromCloud(false); };

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && Session.username) {
          this.syncFromCloud(true);
        }
      });

      if (Session.username && Session.token) {
        this.showApp();
      } else {
        byId('authPage').style.display = 'flex';
        byId('app').style.display = 'none';
      }

      byId('authForm').onsubmit = async (e) => {
        e.preventDefault();
        const u = byId('username').value.trim();
        const p = byId('password').value;
        byId('authBtn').textContent = '登录中...';
        try {
          const saltRes = await Api.getSalt(u);
          const hash = await Api.deriveHash(p, saltRes.salt, saltRes.kdf, saltRes.iterations);
          const res = await Api.login(u, hash);
          Session.set(u, res.token);
          this.showApp();
        } catch (err) {
          UI.toast(err.message, 'error');
        }
        byId('authBtn').textContent = '登录';
      };
    },

    async showApp() {
      byId('authPage').style.display = 'none';
      byId('app').style.display = 'flex';
      byId('profileName').textContent = Session.username;
      
      if (Store.loadCache()) {
        Settings.load();
        Render.all();
      } else {
        byId('detailArea').innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-title">正在加载数据...</div></div>';
      }
      
      this.syncFromCloud(true);
    },

    async syncFromCloud(silent = false) {
      if (!silent) Store.setStatus('saving');
      try {
        await Store.flush(); // 先把本地未保存的推上去
        const res = await Promise.race([
          Api.getData(Session.username),
          new Promise((_, reject) => setTimeout(() => reject(new Error('网络超时')), 8000))
        ]);

        Store.state = res.data;
        Store.rev++;
        Store.persistCache();
        Settings.load();
        Render.all();
        Store.setStatus('idle');
        if (!silent) UI.toast('已同步云端数据', 'success');
      } catch (e) {
        Store.setStatus('error');
        if (e.status === 401 || e.code === 'USER_NOT_FOUND' || e.code === 'TOKEN_REVOKED') {
          UI.toast('登录已失效，请重新登录', 'error');
          this.forceLogout();
        } else {
          if (!silent) UI.toast('同步失败：显示的是本地缓存', 'error');
        }
      }
    },

    forceLogout() {
      Store.state = { records: {}, settings: defaultSettings(), goal: 0, deleted: {}, dataRev: 0 };
      Store.rev = 0;
      Store.dirtyRecords.clear();
      Store.dirtyDeleted.clear();
      Store.settingsDirty = false;
      Session.clear();
      byId('app').style.display = 'none';
      byId('authPage').style.display = 'flex';
    }
  };

  window.App = { 
    forceLogout: App.forceLogout, 
    syncFromCloud: (silent) => App.syncFromCloud(silent),
    importExport: { 
      exportJson: () => {
        const data = Object.assign({}, Store.state, { version: APP_VERSION, exportedAt: new Date().toISOString() });
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup_${formatDateKey(new Date())}.json`; a.click();
      }
    }
  };

  document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
</body>
</html>
