<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工时打卡助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
    }
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
      position: relative;
    }
    /* 登录注册页 */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4a7c59 0%, #3d6b4a 100%);
      padding: 20px;
    }
    .auth-box {
      background: #fff;
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .auth-title {
      text-align: center;
      margin-bottom: 8px;
      color: #4a7c59;
      font-size: 24px;
      font-weight: 600;
    }
    .auth-subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #666;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
      background: #fafafa;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #4a7c59;
      background: #fff;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4a7c59;
      color: #fff;
    }
    .btn-primary:hover { background: #3d6b4a; }
    .btn-primary:active { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-switch {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #666;
    }
    .auth-switch a {
      color: #4a7c59;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .error-msg {
      color: #e74c3c;
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
      min-height: 20px;
    }
    /* 主页面 */
    .main-page { display: none; padding-bottom: 80px; }
    .header {
      background: #4a7c59;
      color: #fff;
      padding: 20px;
      text-align: center;
      position: relative;
    }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header .user-info {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 4px;
    }
    .header .logout-btn {
      position: absolute;
      right: 16px;
      top: 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .clock-section {
      padding: 24px 20px;
      text-align: center;
      background: #fff;
      margin: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .current-time {
      font-size: 32px;
      font-weight: 700;
      color: #333;
      font-variant-numeric: tabular-nums;
    }
    .current-date {
      color: #999;
      font-size: 14px;
      margin-top: 4px;
    }
    .clock-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #e8f5e9;
      background: #4a7c59;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      margin: 20px auto;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(74,124,89,0.3);
    }
    .clock-btn:hover { transform: scale(1.05); }
    .clock-btn:active { transform: scale(0.95); }
    .clock-btn.clock-out { background: #e74c3c; border-color: #fdecea; box-shadow: 0 4px 12px rgba(231,76,60,0.3); }
    .clock-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
    .status-text {
      font-size: 16px;
      color: #666;
      margin-top: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 16px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #4a7c59;
    }
    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .section {
      background: #fff;
      margin: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .section-title {
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .record-list { max-height: 300px; overflow-y: auto; }
    .record-item {
      padding: 12px 20px;
      border-bottom: 1px solid #f5f5f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .record-item:last-child { border-bottom: none; }
    .record-date { font-size: 14px; font-weight: 500; }
    .record-time { font-size: 13px; color: #999; margin-top: 2px; }
    .record-hours {
      font-size: 16px;
      font-weight: 700;
      color: #4a7c59;
    }
    .settings-form {
      padding: 16px 20px;
    }
    .settings-form .form-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .settings-form .form-group label { margin-bottom: 0; }
    .settings-form input, .settings-form select {
      width: 140px;
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      text-align: right;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 14px;
    }
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 100;
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 4px;
      cursor: pointer;
      color: #999;
      font-size: 12px;
    }
    .tab-item.active { color: #4a7c59; }
    .tab-icon { font-size: 20px; margin-bottom: 2px; }
    .hidden { display: none !important; }
    
    @media (max-width: 480px) {
      .app-container { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 登录/注册页 -->
    <div class="auth-page" id="authPage">
      <div class="auth-box">
        <div class="auth-title">⏱️ 工时打卡</div>
        <div class="auth-subtitle" id="authSubtitle">登录到您的账户</div>
        <div class="error-msg" id="authError"></div>
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]{3,32}">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="form-group hidden" id="confirmGroup">
          <label>确认密码</label>
          <input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">登录</button>
        <div class="auth-switch">
          <span id="authSwitchText">还没有账号？</span>
          <a onclick="toggleAuthMode()" id="authSwitchLink">注册新账号</a>
        </div>
      </div>
    </div>

    <!-- 主页面 -->
    <div class="main-page" id="mainPage">
      <div class="header">
        <h1>⏱️ 工时打卡助手</h1>
        <div class="user-info" id="userInfo"></div>
        <button class="logout-btn" onclick="logout()">退出</button>
      </div>

      <div class="clock-section" id="clockSection">
        <div class="current-time" id="currentTime">00:00:00</div>
        <div class="current-date" id="currentDate">2026年1月1日 星期一</div>
        <button class="clock-btn" id="clockBtn" onclick="toggleClock()">上班打卡</button>
        <div class="status-text" id="statusText">今日未打卡</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="todayHours">0.0</div>
          <div class="stat-label">今日工时</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="monthHours">0.0</div>
          <div class="stat-label">本月累计</div>
        </div>
      </div>

      <div class="section hidden" id="recordsSection">
        <div class="section-title">
          <span>打卡记录</span>
          <span style="font-size: 13px; color: #999; font-weight: normal;" id="recordCount">0 条</span>
        </div>
        <div class="record-list" id="recordList">
          <div class="empty-state">暂无打卡记录</div>
        </div>
      </div>

      <div class="section hidden" id="settingsSection">
        <div class="section-title">设置</div>
        <div class="settings-form">
          <div class="form-group">
            <label>目标工时 (小时/月)</label>
            <input type="number" id="settingGoal" value="160">
          </div>
          <div class="form-group">
            <label>平时时薪</label>
            <input type="number" id="settingNormalRate" value="43">
          </div>
          <div class="form-group">
            <label>节假日时薪</label>
            <input type="number" id="settingHolidayRate" value="43">
          </div>
          <div class="form-group">
            <label>计算模式</label>
            <select id="settingMode">
              <option value="hourly">按小时</option>
              <option value="daily">按天</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="saveSettings()" style="margin-top: 12px;">保存设置</button>
        </div>
      </div>

      <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('clock', this)">
          <div class="tab-icon">⏱️</div>
          <div>打卡</div>
        </div>
        <div class="tab-item" onclick="switchTab('records', this)">
          <div class="tab-icon">📋</div>
          <div>记录</div>
        </div>
        <div class="tab-item" onclick="switchTab('settings', this)">
          <div class="tab-icon">⚙️</div>
          <div>设置</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ================== 配置 ==================
    const API_BASE = 'https://api.leoani.dpdns.org/';
    const USERNAME_RE = /^[A-Za-z0-9_-]{3,32}$/;

    // ================== 状态 ==================
    let currentUser = localStorage.getItem('wc_username') || null;
    let sessionToken = localStorage.getItem('wc_session') || null;
    let userData = defaultUserData();
    let isLoginMode = true;

    function defaultUserData() {
      return {
        records: {},
        settings: {
          mode: 'hourly',
          normalRate: 43,
          holidayRate: 43,
          baseSalary: 0,
          salaryNormal: 0,
          salaryOt: 0,
          salaryWeekend: 0,
          salaryHoliday: 0,
          rule: 'fixed'
        },
        goal: 160
      };
    }

    // ================== 初始化 ==================
    document.addEventListener('DOMContentLoaded', async () => {
      updateTime();
      setInterval(updateTime, 1000);

      if (currentUser && sessionToken) {
        showMainPage();
        try {
          await loadData();
        } catch (err) {
          if (err.status === 401 || err.status === 403) {
            forceLogout('登录已失效，请重新登录');
          } else {
            alert('加载数据失败: ' + err.message);
          }
        }
      } else {
        clearSession();
      }
    });

    // ================== 时间更新 ==================
    function updateTime() {
      const now = new Date();
      document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
      document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
      });
    }

    function getTodayKey(date = new Date()) {
      // 使用浏览器本地日期，不使用 toISOString()，避免 GMT+8 凌晨被算到前一天。
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getCurrentHHMM(date = new Date()) {
      return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
    }

    // ================== 认证页面切换 ==================
    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('authSubtitle').textContent = isLoginMode ? '登录到您的账户' : '注册新账号';
      document.getElementById('authBtn').textContent = isLoginMode ? '登录' : '注册';
      document.getElementById('confirmGroup').classList.toggle('hidden', isLoginMode);
      document.getElementById('authSwitchText').textContent = isLoginMode ? '还没有账号？' : '已有账号？';
      document.getElementById('authSwitchLink').textContent = isLoginMode ? '注册新账号' : '返回登录';
      document.getElementById('password').setAttribute('autocomplete', isLoginMode ? 'current-password' : 'new-password');
      document.getElementById('authError').textContent = '';
    }

    function showError(msg) {
      document.getElementById('authError').textContent = msg || '';
    }

    // ================== 密码哈希 (Web Crypto) ==================
    async function sha256(message) {
      const encoder = new TextEncoder();
      const data = encoder.encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function generateSalt() {
      const array = new Uint8Array(16);
      crypto.getRandomValues(array);
      return btoa(String.fromCharCode(...array));
    }

    // ================== API 请求 ==================
    async function apiCall(action, payload = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (sessionToken) headers.Authorization = `Bearer ${sessionToken}`;

      let res;
      try {
        res = await fetch(API_BASE, {
          method: 'POST',
          headers,
          body: JSON.stringify({ action, ...payload })
        });
      } catch (networkError) {
        const err = new Error('无法连接服务器，请检查网络、Worker 域名和 CORS 配置');
        err.status = 0;
        throw err;
      }

      const text = await res.text();
      let data = {};
      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          data = { error: text.slice(0, 300) };
        }
      }

      if (!res.ok) {
        const err = new Error(data.detail || data.error || `请求失败 (${res.status})`);
        err.status = res.status;
        err.code = data.code || '';
        throw err;
      }
      return data;
    }

    // ================== 登录/注册处理 ==================
    async function handleAuth() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('authBtn');

      if (!username || !password) {
        showError('请输入用户名和密码');
        return;
      }
      if (!USERNAME_RE.test(username)) {
        showError('用户名需为 3-32 位，只能包含字母、数字、下划线和连字符');
        return;
      }

      if (!isLoginMode) {
        if (password !== confirmPassword) {
          showError('两次输入的密码不一致');
          return;
        }
        if (password.length < 6) {
          showError('密码长度至少为 6 位');
          return;
        }
      }

      btn.disabled = true;
      btn.textContent = '请稍候...';
      showError('');

      try {
        if (isLoginMode) {
          // 登录：先从私有仓库读取用户 salt，再计算哈希。
          const saltRes = await apiCall('getSalt', { username });
          const hash = await sha256(saltRes.salt + password);
          const loginRes = await apiCall('login', { username, hash });

          if (!loginRes.token) throw new Error('服务器未返回登录令牌');
          currentUser = username;
          sessionToken = loginRes.token;
          localStorage.setItem('wc_username', username);
          localStorage.setItem('wc_session', sessionToken);

          showMainPage();
          await loadData();
        } else {
          const salt = generateSalt();
          const hash = await sha256(salt + password);
          await apiCall('register', { username, hash, salt });

          alert('注册成功！请登录');
          toggleAuthMode();
          document.getElementById('password').value = '';
          document.getElementById('confirmPassword').value = '';
        }
      } catch (err) {
        if (isLoginMode && (err.status === 401 || err.status === 403) && sessionToken) {
          clearSession();
        }
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = isLoginMode ? '登录' : '注册';
      }
    }

    // ================== 页面切换 ==================
    function showMainPage() {
      document.getElementById('authPage').style.display = 'none';
      document.getElementById('mainPage').style.display = 'block';
      document.getElementById('userInfo').textContent = `当前用户: ${currentUser}`;
    }

    function clearSession() {
      currentUser = null;
      sessionToken = null;
      localStorage.removeItem('wc_username');
      localStorage.removeItem('wc_session');
    }

    function forceLogout(message = '') {
      clearSession();
      userData = defaultUserData();
      document.getElementById('authPage').style.display = 'flex';
      document.getElementById('mainPage').style.display = 'none';
      document.getElementById('password').value = '';
      document.getElementById('confirmPassword').value = '';
      if (message) showError(message);
    }

    function logout() {
      if (!confirm('确定要退出登录吗？')) return;
      document.getElementById('username').value = '';
      forceLogout('');
    }

    function switchTab(tab, el) {
      document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
      if (el) el.classList.add('active');

      document.getElementById('clockSection').classList.toggle('hidden', tab !== 'clock');
      document.getElementById('recordsSection').classList.toggle('hidden', tab !== 'records');
      document.getElementById('settingsSection').classList.toggle('hidden', tab !== 'settings');

      if (tab === 'records') updateUI();
    }

    // ================== 数据操作 ==================
    async function loadData() {
      const data = await apiCall('getData', { username: currentUser });
      userData = {
        ...defaultUserData(),
        ...data,
        records: data.records || {},
        settings: {
          ...defaultUserData().settings,
          ...(data.settings || {})
        },
        goal: Number(data.goal) || 160
      };
      applySettings();
      updateUI();
    }

    async function saveData() {
      return apiCall('setData', { username: currentUser, data: userData });
    }

    function applySettings() {
      const s = userData.settings || defaultUserData().settings;
      document.getElementById('settingGoal').value = Number(userData.goal) || 160;
      document.getElementById('settingNormalRate').value = Number(s.normalRate) || 43;
      document.getElementById('settingHolidayRate').value = Number(s.holidayRate) || 43;
      document.getElementById('settingMode').value = s.mode || 'hourly';
    }

    async function saveSettings() {
      const backup = JSON.parse(JSON.stringify(userData));
      userData.goal = parseFloat(document.getElementById('settingGoal').value) || 160;
      userData.settings.normalRate = parseFloat(document.getElementById('settingNormalRate').value) || 43;
      userData.settings.holidayRate = parseFloat(document.getElementById('settingHolidayRate').value) || 43;
      userData.settings.mode = document.getElementById('settingMode').value;

      try {
        await saveData();
        alert('设置已保存');
        updateUI();
      } catch (err) {
        userData = backup;
        applySettings();
        if (err.status === 401 || err.status === 403) {
          forceLogout('登录已失效，请重新登录');
        } else {
          alert('保存设置失败: ' + err.message);
        }
      }
    }

    // ================== 打卡逻辑 ==================
    function updateUI() {
      const todayKey = getTodayKey();
      const todayRecord = userData.records[todayKey] || null;

      const btn = document.getElementById('clockBtn');
      const status = document.getElementById('statusText');

      if (todayRecord && todayRecord.end) {
        btn.textContent = '已完成';
        btn.className = 'clock-btn';
        btn.disabled = true;
        status.textContent = `今日已下班 ${todayRecord.end}，工时 ${Number(todayRecord.hours || 0).toFixed(1)} 小时`;
      } else if (todayRecord && todayRecord.start) {
        btn.textContent = '下班打卡';
        btn.className = 'clock-btn clock-out';
        btn.disabled = false;
        status.textContent = `上班时间 ${todayRecord.start}，工作中...`;
      } else {
        btn.textContent = '上班打卡';
        btn.className = 'clock-btn';
        btn.disabled = false;
        status.textContent = '今日未打卡';
      }

      let todayH = 0;
      if (todayRecord && Number.isFinite(Number(todayRecord.hours))) todayH = Number(todayRecord.hours);
      document.getElementById('todayHours').textContent = todayH.toFixed(1);

      let monthH = 0;
      const currentMonth = todayKey.substring(0, 7);
      Object.entries(userData.records).forEach(([date, rec]) => {
        if (date.startsWith(currentMonth) && Number.isFinite(Number(rec.hours))) {
          monthH += Number(rec.hours);
        }
      });
      document.getElementById('monthHours').textContent = monthH.toFixed(1);

      const list = document.getElementById('recordList');
      const sorted = Object.entries(userData.records).sort((a, b) => b[0].localeCompare(a[0]));
      document.getElementById('recordCount').textContent = `${sorted.length} 条`;

      if (sorted.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无打卡记录</div>';
        return;
      }

      list.innerHTML = sorted.map(([date, rec]) => {
        const [year, month, day] = date.split('-').map(Number);
        const d = new Date(year, month - 1, day);
        const dateStr = `${d.getMonth() + 1}月${d.getDate()}日`;
        const timeStr = rec.start ? `${rec.start}${rec.end ? ' - ' + rec.end : ' (工作中)'}` : '-';
        const hours = Number(rec.hours);
        return `
          <div class="record-item">
            <div>
              <div class="record-date">${dateStr}</div>
              <div class="record-time">${timeStr}</div>
            </div>
            <div class="record-hours">${Number.isFinite(hours) && hours > 0 ? hours.toFixed(1) + 'h' : '-'}</div>
          </div>
        `;
      }).join('');
    }

    async function toggleClock() {
      const btn = document.getElementById('clockBtn');
      if (btn.disabled) return;

      const backup = JSON.parse(JSON.stringify(userData));
      btn.disabled = true;

      try {
        const now = new Date();
        const timeStr = getCurrentHHMM(now);
        const todayKey = getTodayKey(now);

        if (btn.textContent === '上班打卡') {
          userData.records[todayKey] = {
            start: timeStr,
            end: null,
            hours: 0,
            type: 'normal'
          };
        } else {
          const rec = userData.records[todayKey];
          if (!rec || !rec.start) throw new Error('找不到今日上班打卡记录，请刷新页面后重试');

          rec.end = timeStr;
          const [sh, sm] = rec.start.split(':').map(Number);
          const [eh, em] = timeStr.split(':').map(Number);
          let hours = (eh * 60 + em - sh * 60 - sm) / 60;
          if (hours < 0) hours += 24;
          hours = Math.max(0, Math.round(hours * 10) / 10);
          if (hours > 5) hours = Math.max(0, hours - 1);
          rec.hours = Math.round(hours * 10) / 10;
        }

        await saveData();
        updateUI();
      } catch (err) {
        userData = backup;
        updateUI();
        if (err.status === 401 || err.status === 403) {
          forceLogout('登录已失效，请重新登录');
        } else {
          alert('保存打卡失败: ' + err.message);
        }
      }
    }
  </script>
