<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.leoani.dpdns.org;">
<meta name="theme-color" content="#F4F5F6">
<meta name="color-scheme" content="light dark">
<title>工时记录助手</title>
<style>
/* 🟢 极简 HIG 视觉系统 */
:root{--bg:#F4F5F6;--surface:#FFF;--surface-hover:#F8F9FA;--text:#000;--text-secondary:#6B7280;--text-tertiary:#9CA3AF;--primary:#52796F;--primary-soft:#E6EEEA;--danger:#EF4444;--border:#E5E7EB;--border-strong:#D1D5DB;--shadow-sm:0 2px 8px rgba(0,0,0,0.04);--shadow-md:0 8px 24px rgba(0,0,0,0.08);--radius-md:12px;--radius-lg:16px;--radius-full:999px;--safe-bottom:env(safe-area-inset-bottom,20px);--safe-top:env(safe-area-inset-top,20px);--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--gutter:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0F172A;--surface:#1E293B;--surface-hover:#334155;--text:#FFF;--text-secondary:#94A3B8;--text-tertiary:#64748B;--primary:#7BA99A;--primary-soft:#1E3A34;--border:#334155;--border-strong:#475569;--shadow-sm:0 2px 8px rgba(0,0,0,0.2);--shadow-md:0 8px 24px rgba(0,0,0,0.3)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh}
button{background:none;border:none;cursor:pointer;color:inherit;font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hidden{display:none!important}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-top);background:var(--bg)}

/* Header */
.header{padding:16px;background:transparent;transition:all .3s cubic-bezier(.2,.8,.2,1);overflow:hidden;flex-shrink:0}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;transition:margin .3s}
.app-name{font-weight:800;font-size:16px;color:var(--text);letter-spacing:-.3px}
.header-year{color:var(--text-tertiary);font-size:13px;margin-left:6px;font-weight:500}
.sync-bar{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;font-weight:500}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#10B981;transition:background .3s}
.sync-dot.pending{background:#F59E0B}
.sync-dot.error{background:#EF4444}
.sync-dot.syncing{background:#3B82F6;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.header-month{display:flex;justify-content:center;align-items:center;gap:24px;margin-bottom:20px;transition:all .3s;max-height:60px;opacity:1}
.month-label{font-size:24px;font-weight:900;letter-spacing:-.5px;color:var(--text);min-width:80px;text-align:center}
.nav-arrow{font-size:18px;color:var(--text-tertiary);padding:8px;cursor:pointer}
.today-btn{font-size:11px;padding:4px 10px;border-radius:var(--radius-full);background:var(--primary-soft);color:var(--primary);font-weight:600}
.stats-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 12px;box-shadow:var(--shadow-sm);display:flex;transition:all .3s;max-height:100px}
.stat-item{flex:1;text-align:center}
.stat-value{font-size:22px;font-weight:900;letter-spacing:-.5px;color:var(--text)}
.stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px;font-weight:500}
.progress-wrap{margin-top:16px;padding:0 4px;transition:all .3s;max-height:40px}
.progress-bg{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);width:0%;border-radius:2px;transition:width .3s}
.progress-text{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-top:8px;font-weight:600}
#app.collapse-header .header{padding-bottom:8px;border-bottom:1px solid var(--border);background:var(--surface)}
#app.collapse-header .header-top{margin-bottom:0}
#app.collapse-header .header-month,#app.collapse-header .stats-bar,#app.collapse-header .progress-wrap{max-height:0;opacity:0;margin:0;padding:0;pointer-events:none;overflow:hidden}

/* 页面框架 */
.page{display:none;flex:1;flex-direction:column;overflow:hidden}
.page.active{display:flex}
.page-scroll{flex:1;overflow-y:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}

/* 日历 (完整恢复农历和节假日) */
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--text-tertiary);margin-bottom:12px;font-weight:600}
.weekdays span:first-child,.weekdays span:last-child{color:var(--danger)}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius-md);font-size:16px;font-weight:600;color:var(--text);cursor:pointer;position:relative;transition:all .2s;border:1.5px solid transparent;line-height:1.2}
.day-cell.has-record:not(.today):not(.selected){background:var(--primary-soft)}
.day-cell.has-record:not(.today):not(.selected):hover{background:#d8e8e2}
.day-cell.today{background:var(--primary);color:#FFF}
.day-cell.selected:not(.today){border-color:var(--primary);color:var(--primary);background:var(--surface)}
.day-cell.other-month{color:var(--text-tertiary);opacity:.4}
.day-sub{font-size:10px;color:var(--text-secondary);margin-top:2px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-cell.has-record .day-sub{color:var(--primary);font-weight:800}
.day-cell.today .day-sub{color:rgba(255,255,255,.9)}
.dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.star{position:absolute;top:4px;right:5px;font-size:11px;color:#D4A373}

/* 按钮 */
.btns-group{display:flex;flex-direction:column;gap:12px}
.btn{height:52px;border-radius:var(--radius-md);border:none;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#FFF}
.btn-secondary{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary)}
.btn-danger{background:var(--danger);color:#fff}

/* 表单 (彻底修复丑陋的裸输入框) */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-secondary)}
.form-group input{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--bg);font-size:16px;color:var(--text);outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--primary);background:var(--surface)}
.input-card{background:var(--surface);margin:0 0 16px 0;padding:0 16px;border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.input-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--border)}
.input-row:last-child{border-bottom:none}
.input-label{font-size:15px;font-weight:600;color:var(--text)}
.input-value{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800}
.input-value input{width:100px;padding:8px;text-align:right;border:1px solid transparent;background:var(--bg);border-radius:8px;font-weight:800;outline:none}
.input-value input:focus{border-color:var(--primary)}

/* 统计 */
.card-num{font-size:38px;font-weight:900;letter-spacing:-1px;margin:8px 0;color:var(--text)}
.card-sub{font-size:13px;color:var(--text-secondary);font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center}
.stat-box-num{font-size:26px;font-weight:900;letter-spacing:-.5px;color:var(--text)}
.stat-box-label{font-size:12px;color:var(--text-secondary);margin-top:4px;font-weight:600}
.chart-title{font-size:16px;font-weight:900;color:var(--text);margin-bottom:20px}
.hours-dist{display:flex;flex-direction:column;align-items:center;gap:20px}
.hours-donut{width:140px;height:140px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.hours-donut::after{content:"";position:absolute;width:90px;height:90px;background:var(--surface);border-radius:50%}
.hours-donut-center{position:relative;z-index:2;text-align:center}
.hours-donut-total{font-size:24px;font-weight:900;color:var(--text)}
.hours-donut-label{font-size:10px;color:var(--text-tertiary);font-weight:800;letter-spacing:1px}
.hours-list{width:100%;display:flex;flex-direction:column}
.hours-list-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.hours-list-row:last-child{border-bottom:none}
.hours-list-name{font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text)}
.hours-list-name::before{content:"";width:8px;height:8px;border-radius:2px}
.hours-list-money{font-weight:800;color:var(--text)}
.row-normal .hours-list-name::before{background:var(--primary)}
.row-ot .hours-list-name::before{background:#D4A373}
.row-weekend .hours-list-name::before{background:#7B95A6}
.row-holiday .hours-list-name::before{background:#EF4444}
.ledger-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.ledger-balance{font-size:30px;font-weight:900;letter-spacing:-.5px;color:var(--text)}
.ledger-stat{text-align:right;font-size:12px;color:var(--text-secondary);line-height:1.6;font-weight:500}
.ledger-val.earn{color:#10B981;font-weight:900}
.ledger-val.use{color:#F87171;font-weight:900}

/* 导航 */
.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--surface);padding:8px 0 var(--safe-bottom);flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-tertiary);cursor:pointer}
.nav-item.active{color:var(--primary)}
.nav-icon{font-size:20px;font-weight:500}
.nav-label{font-size:11px;font-weight:800}

/* 我的面板 (恢复完整的列表组) */
.list-group{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:16px}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:500;cursor:pointer;background:transparent;width:100%;text-align:left;transition:background .2s}
.list-item:last-child{border-bottom:none}
.list-item:active{background:var(--surface-hover)}
.list-item.danger{color:var(--danger);font-weight:600}
.list-item .arrow{color:var(--text-tertiary);font-size:14px}
.list-header{padding:16px 20px 8px;font-size:13px;color:var(--text-secondary);font-weight:600;margin:0}

/* 弹窗和计算器 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:100}
.modal-overlay.show{display:flex}
.modal-content{background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:24px 20px calc(20px + var(--safe-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
.modal-overlay.show .modal-content{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px}
.modal-title{font-size:18px;font-weight:900}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
.field-label{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px}
.option-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.option-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.option-btn{padding:10px 4px;border:1.5px solid transparent;border-radius:var(--radius-md);background:var(--bg);text-align:center;font-size:13px;font-weight:600;color:var(--text-secondary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .2s;min-height:52px}
.option-btn.active{background:var(--surface);border-color:var(--primary);color:var(--primary)}
.hours-box{background:var(--bg);border-radius:var(--radius-md);padding:0 16px;margin-bottom:20px}
.hours-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border)}
.hours-row:last-child{border-bottom:none}
.hours-control{display:flex;align-items:center;gap:12px}
.hours-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:14px;font-weight:600}
.hours-value{min-width:60px;text-align:center;font-size:20px;font-weight:900}
.note-area textarea{width:100%;height:80px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);resize:none;color:var(--text);font-size:14px}
.calc-tabs{display:flex;gap:8px;margin-bottom:16px}
.calc-tab{flex:1;height:44px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:15px}
.calc-tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.calc-panel{display:none}
.calc-panel.active{display:block}
.calc-display{background:var(--surface);border-radius:var(--radius-lg);padding:20px;text-align:right;margin-bottom:16px;border:1px solid var(--border)}
.calc-expr{font-size:13px;color:var(--text-secondary);min-height:20px;word-break:break-all}
.calc-result{font-size:32px;font-weight:900;word-break:break-all}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.calc-key{height:60px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border);font-size:20px;font-weight:600}
.calc-key.op{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.calc-key.eq{background:var(--text);color:var(--bg);border-color:transparent}

/* 认证 & 提示 */
.toast-wrap{position:fixed;top:20px;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:1000;pointer-events:none}
.toast{background:rgba(30,32,38,.9);color:#fff;padding:10px 20px;border-radius:var(--radius-full);font-size:14px;font-weight:600;margin-bottom:8px;box-shadow:var(--shadow-lg);animation:toastIn .3s;backdrop-filter:blur(8px)}
.toast.success{color:#10B981}
.toast.error{color:#EF4444}
@keyframes toastIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.auth-page{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.auth-box{width:100%;max-width:360px;background:var(--surface);padding:32px 24px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.auth-title{font-size:24px;font-weight:900;text-align:center;margin-bottom:8px}
.auth-subtitle{font-size:13px;color:var(--text-secondary);text-align:center;margin-bottom:24px}
.auth-btn{width:100%;height:50px;background:var(--primary);color:#fff;border-radius:var(--radius-md);font-size:16px;font-weight:700;margin-top:8px}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--text-secondary)}
.auth-switch button{color:var(--primary);font-weight:700;margin-left:4px}
</style>
</head>
<body>

<div class="auth-page" id="authPage">
  <form class="auth-box" id="authForm" novalidate>
    <h1 class="auth-title">工时记录</h1>
    <p class="auth-subtitle" id="authSubtitle">登录到您的账户</p>
    <div class="form-group"><label for="username">用户名</label><input type="text" id="username" placeholder="3-32 位字母或数字" autocomplete="username" maxlength="32" required></div>
    <div class="form-group"><label for="password">密码</label><input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required></div>
    <div class="form-group hidden" id="confirmGroup"><label for="confirmPassword">确认密码</label><input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="new-password"></div>
    <button class="auth-btn" id="authBtn" type="submit">登录</button>
    <div class="auth-switch"><span id="authSwitchText">还没有账号？</span><button type="button" id="authSwitchLink">注册新账号</button></div>
  </form>
</div>

<div id="app" style="display:none;">
  <header class="header">
    <div class="header-top">
      <div><span class="app-name">工时记录</span><span class="header-year" id="headerYear"></span></div>
      <button class="sync-bar" id="syncBar" type="button"><span class="sync-dot" id="syncDot"></span><span id="syncText">已同步</span></button>
    </div>
    <div class="header-month">
      <button class="nav-arrow" type="button" id="prevMonth">◀</button>
      <span class="month-label" id="headerMonth">十月</span>
      <button class="nav-arrow" type="button" id="nextMonth">▶</button>
      <button class="today-btn hidden" type="button" id="todayBtn">今天</button>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-value" id="stDays">0天</div><div class="stat-label">出勤</div></div>
      <div class="stat-item"><div class="stat-value" id="stHours">0H</div><div class="stat-label">工时</div></div>
      <div class="stat-item"><div class="stat-value" id="stMoney">¥0</div><div class="stat-label">收入</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bg"><div class="progress-fill" id="monthProgress"></div></div>
      <div class="progress-text"><span>本月时间进度</span><span id="progressText">0%</span></div>
    </div>
  </header>

  <section class="page active" id="pageRecord">
    <div class="page-scroll">
      <div class="card">
        <div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="days-grid" id="calGrid"></div>
      </div>
      <div class="btns-group">
        <button class="btn btn-primary" id="quickPunchBtn" type="button">一键打卡（今日）</button>
        <button class="btn btn-secondary" id="addRecordBtn" type="button">添加记录（自定义工时）</button>
      </div>
      <div id="detailArea" style="margin-top:8px;"></div>
    </div>
  </section>

  <section class="page" id="pageStats">
    <div class="page-scroll">
      <div class="card">
        <div style="font-size:13px;color:var(--text-secondary);font-weight:600;">本月预估收入</div>
        <div class="card-num" id="monthIncome">¥0</div>
        <div class="card-sub">平均日薪 <span id="avgDailyIncome">¥0</span> · 最高日收入 <span id="maxDailyIncome">¥0</span></div>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-box-num" id="boxDays">0</div><div class="stat-box-label">出勤天数</div></div>
        <div class="stat-box"><div class="stat-box-num" id="boxHours">0</div><div class="stat-box-label">总工时</div></div>
        <div class="stat-box"><div class="stat-box-num" id="boxNormal">0</div><div class="stat-box-label">正班工时</div></div>
        <div class="stat-box"><div class="stat-box-num" id="boxOt">0</div><div class="stat-box-label">加班工时</div></div>
      </div>
      <div class="card"><h2 class="chart-title">工时分布</h2><div id="hoursPie"></div></div>
    </div>
  </section>

  <section class="page" id="pageCalculator">
    <div class="page-scroll">
      <div class="calc-tabs" role="tablist">
        <button class="calc-tab active" type="button" data-tab="tax">个税</button>
        <button class="calc-tab" type="button" data-tab="salary">工资</button>
        <button class="calc-tab" type="button" data-tab="simple">计算器</button>
      </div>
      <div class="calc-panel active" id="calcTax">
        <div class="card">
          <div class="form-group"><label>税前月收入（元）</label><input type="number" id="taxIncome" value="0" step="100"></div>
          <div class="form-group"><label>五险一金比例（合计 %）</label><input type="number" id="taxInsuranceRate" value="0" step="0.5"></div>
          <div class="card" style="background:var(--bg);border:none;padding:16px;margin-top:16px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;"><span>应纳税所得额</span><strong id="dtTaxable">¥0</strong></div>

  function createIncomeEngine(s, h) {
    const mode = s.mode === 'salary' ? 'salary' : 'hourly';
    function bucketOf(rec, date) { const k=formatDateKey(date), mk=h.isWorkday(k); if(rec.type==='holiday'||(h.isHoliday(k)&&!mk)) return 'holiday'; if((isWeekend(date)&&!mk)||rec.type==='weekend') return 'weekend'; return 'normal'; }

    return { mode, bucketOf, rateOf, of };
  }

  function aggregateMonth(year, month, records, settings, holiday, rev, goal) {

    const inc=createIncomeEngine(settings,holiday), cat={ normal:{h:0,d:0,i:0}, ot:{h:0,d:0,i:0}, weekend:{h:0,d:0,i:0}, holiday:{h:0,d:0,i:0} };

    }
    const g=num(goal), sum={ year, month, cat, totalDays:td, totalHours:th, totalIncome:ti, timeoffEarned:te, timeoffUsed:tu, avgDailyHours:td?th/td:0, avgDailyIncome:td?ti/td:0, maxDailyIncome:0, goalPct:g>0?Math.min(100,(th/g)*100):0 };
    if(Store.cache.size>24) Store.cache.delete(Store.cache.keys().next().value); Store.cache.set(key,sum); return sum;
  }

    async flush() {

    init(){
      byId('modeSwitch').onclick=()=>{ Store.state.settings.mode=Store.state.settings.mode==='salary'?'hourly':'salary'; this.load(); Store.settingsDirty=true; Store.rev++; Render.all(); };
      byId('saveSettingsBtn').onclick=()=>{ if(Store.state.settings.mode==='hourly'){ Store.state.settings.normalRate=clamp(byId('inNormal').value,0,5000,0); Store.state.settings.holidayRate=clamp(byId('inHoliday').value,0,5000,0); } else { Store.state.settings.baseSalary=clamp(byId('inBaseSalary').value,0,1000000,0); Store.state.settings.salaryDays=clamp(byId('inSalaryDays').value,1,31,21.75); Store.state.settings.salaryHours=clamp(byId('inSalaryHours').value,1,24,8); const b=Store.state.settings.baseSalary/Store.state.settings.salaryDays/Store.state.settings.salaryHours; Store.state.settings.salaryNormal=round1(b*1); Store.state.settings.salaryOt=round1(b*1.5); Store.state.settings.salaryWeekend=round1(b*2); Store.state.settings.salaryHoliday=round1(b*3); } Store.settingsDirty=true; Store.rev++; Render.all(); Store.flush(); UI.toast('设置已保存','success'); };
      byId('goalSaveBtn').onclick=()=>{ Store.state.goal=clamp(byId('goalInput').value,0,1000,0); Store.settingsDirty=true; Store.rev++; Render.all(); Store.flush(); UI.toast('目标已更新','success'); };
    },
    load(){ const s=Store.state.settings; byId('hourlyForm').classList.toggle('hidden',s.mode==='salary'); byId('salaryForm').classList.toggle('hidden',s.mode==='hourly'); byId('inNormal').value=s.normalRate; byId('inHoliday').value=s.holidayRate; byId('inBaseSalary').value=s.baseSalary; byId('inSalaryDays').value=s.salaryDays; byId('inSalaryHours').value=s.salaryHours; byId('goalInput').value=Store.state.goal; }
  };

  const Calculator = {
    init(){
      document.querySelectorAll('.calc-tab').forEach(t=>{ t.onclick=()=>{ document.querySelectorAll('.calc-tab').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.calc-panel').forEach(x=>x.classList.remove('active')); t.classList.add('active'); byId('calc'+t.dataset.tab.charAt(0).toUpperCase()+t.dataset.tab.slice(1)).classList.add('active'); }; });
      const calcTax=()=>{ const g=clamp(byId('taxIncome').value,0,10000000,0), i=g*clamp(byId('taxInsuranceRate').value,0,100,0)/100, tb=Math.max(0,g-i-5000); let tax=0; for(const b of IIT_BRACKETS){ if(tb<=b.max){ tax=Math.max(0,tb*b.rate-b.quick); break; } } byId('dtTaxable').textContent='¥'+tb.toFixed(2); byId('dtTax').textContent='¥'+tax.toFixed(2); byId('dtNet').textContent='¥'+(g-i-tax).toFixed(2); };
      byId('taxIncome').oninput=calcTax; byId('taxInsuranceRate').oninput=calcTax;
      const calcSalary=()=>{ const r=clamp(byId('salaryRate').value,0,10000,0), h=clamp(byId('salaryHours').value,0,24,0), d=clamp(byId('salaryDays').value,0,31,0); byId('salaryDaily').textContent='¥'+(r*h).toFixed(2); byId('salaryMonthly').textContent='¥'+(r*h*d).toFixed(2); };
      byId('salaryRate').oninput=calcSalary; byId('salaryHours').oninput=calcSalary; byId('salaryDays').oninput=calcSalary;
      let tokens=[], current='0', justEval=false;
      const updateUI=()=>byId('calcExpr').textContent=tokens.join(' ')+(current?' '+current:''), computeCalc=(arr)=>{ const stk=arr.slice(); for(let i=1;i<stk.length-1;i+=2){ if(stk[i]==='×'||stk[i]==='÷'){ const l=parseFloat(stk[i-1])||0, r=parseFloat(stk[i+1])||0; stk.splice(i-1,3,String(stk[i]==='×'?l*r:(r===0?NaN:l/r))); i-=2; } } let res=parseFloat(stk[0])||0; for(let i=1;i<stk.length-1;i+=2){ const r=parseFloat(stk[i+1])||0; if(stk[i]==='+')res+=r; if(stk[i]==='-')res-=r; } return isFinite(res)?String(parseFloat(res.toPrecision(12))):'Error'; };
      byId('calcKeys').onclick=e=>{ const k=e.target.closest('[data-key]'); if(!k)return; const v=k.dataset.key; if(v==='C'){tokens=[];current='0';justEval=false;}else if(v==='⌫'){current=current.length>1?current.slice(0,-1):'0';}else if('+-×÷'.includes(v)){if(justEval){tokens=[];justEval=false;}if(current!=='0'){tokens.push(current);current='0';}else if(tokens.length&&!'+-×÷'.includes(tokens[tokens.length-1]))tokens.pop();tokens.push(v);}else if(v==='='){if(current!=='0')tokens.push(current);while(tokens.length&&'+-×÷'.includes(tokens[tokens.length-1]))tokens.pop();if(tokens.length){const r=computeCalc(tokens);byId('calcExpr').textContent=tokens.join(' ')+' =';current=r;tokens=[];justEval=true;byId('calcResult').textContent=r;return;}}else if(v==='.'){if(!current.includes('.'))current+='.';}else if(v==='±'){current=current.startsWith('-')?current.slice(1):'-'+current;}else if(v==='%'){current=String(parseFloat(current)/100);}else{if(justEval||current==='0'){current=v;justEval=false;}else current+=v;} updateUI(); byId('calcResult').textContent=current; };
    }
  };

  const ImportExport = {
    exportJson(){ const d=Object.assign({},Store.state,{version:APP_VERSION,exportedAt:new Date().toISOString()}), b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`backup_${formatDateKey(new Date())}.json`; a.click(); UI.toast('导出成功','success'); },
    importJson(){ const i=document.createElement('input'); i.type='file'; i.accept='.json'; i.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{ const d=JSON.parse(ev.target.result); if(!d.records||typeof d.records!=='object')throw new Error('无效的备份文件'); Store.state=d; ensureState(); Store.rev++; Store.settingsDirty=true; Store.dirtyRecords.clear(); Store.dirtyDeleted.clear(); for(const k in d.records)Store.dirtyRecords.add(k); Store.persistCache(); Settings.load(); Render.all(); Store.flush(); UI.toast('导入成功','success'); }catch(err){ UI.toast('导入失败：'+err.message,'error'); } }; r.readAsText(f); }; i.click(); }
  };

  const App = {
    init(){
      Session.init(); Calendar.init(); Clock.init(); Settings.init(); Calculator.init();
      document.querySelectorAll('.nav-item').forEach(i=>i.onclick=()=>UI.goPage(i.dataset.page));
      byId('syncBar').onclick=()=>this.syncFromCloud(false);
      let lst=0; document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&Session.username){ const n=Date.now(); if(n-lst>60000){ lst=n; this.syncFromCloud(true); } } });
      window.addEventListener('storage',e=>{ if(e.key===SESSION_KEY||e.key===USER_KEY){ if(!e.newValue&&Session.username)this.forceLogout(); else if(e.newValue&&e.newValue!==Session.username)window.location.reload(); } });
      if(Session.username&&Session.token)this.showApp(); else { byId('authPage').style.display='flex'; byId('app').style.display='none'; }
      byId('authForm').onsubmit=async e=>{ e.preventDefault(); const u=byId('username').value.trim(), p=byId('password').value; byId('authBtn').textContent='登录中...'; try{ const sr=await Api.getSalt(u), h=await Api.deriveHash(p,sr.salt,sr.kdf,sr.iterations), res=await Api.login(u,h); Session.set(u,res.token); this.showApp(); }catch(err){ UI.toast(err.message,'error'); } byId('authBtn').textContent='登录'; };
    },
    async showApp(){ byId('authPage').style.display='none'; byId('app').style.display='flex'; byId('profileName').textContent=Session.username; ensureState(); Settings.load(); Render.all(); if(Store.loadCache()){ Settings.load(); Render.all(); } this.syncFromCloud(true); },
    async syncFromCloud(silent=false){ if(!silent)Store.setStatus('saving'); try{ await Store.flush(); const res=await Promise.race([Api.getData(Session.username),new Promise((_,rej)=>setTimeout(()=>rej(new Error('网络超时')),8000))]); if(!res||!res.data)throw new Error('返回数据为空'); Store.state=res.data; ensureState(); Store.rev++; Store.persistCache(); Settings.load(); Render.all(); Store.setStatus('idle'); if(!silent)UI.toast('已同步云端数据','success'); }catch(e){ Store.setStatus('error'); if(e.status===401||e.code==='USER_NOT_FOUND'||e.code==='TOKEN_REVOKED'){ UI.toast('登录已失效，请重新登录','error'); this.forceLogout(); } else { if(!silent)UI.toast('同步失败，当前展示本地数据','error'); } } },
    async clearAll(){ if(!await UI.confirmDangerous('清空数据','将删除所有打卡记录且不可恢复，是否继续？'))return; Store.state.records={}; Store.state.deleted={}; Store.deleted={}; Store.rev++; Store.settingsDirty=true; Store.dirtyRecords.clear(); Store.dirtyDeleted.clear(); Store.persistCache(); Render.all(); Store.flush(); UI.toast('已清空数据','success'); },
    forceLogout(){ Store.state=defaultUserData(); Store.rev=0; Store.dirtyRecords.clear(); Store.dirtyDeleted.clear(); Store.settingsDirty=false; Session.clear(); byId('app').style.display='none'; byId('authPage').style.display='flex'; }
  };

  window.App = { forceLogout: App.forceLogout, syncFromCloud: s => App.syncFromCloud(s), clearAll: () => App.clearAll(), importExport: ImportExport };
  document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
</body>
</html>
